<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Habit Tracker</h1>
      <p class="subtitle">Build your streaks, one day at a time</p>
    </header>

    <!-- Add Habit Form -->
    <section class="add-habit-section">
      <form id="addHabitForm" class="habit-form">
        <input 
          type="text" 
          id="habitInput" 
          placeholder="Add a new habit (e.g., Read 30 min)" 
          maxlength="30"
          required
        >
        <button type="submit">Add Habit</button>
      </form>
    </section>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">📝</div>
      <h2>No habits yet</h2>
      <p>Start building better habits. Add one above!</p>
    </div>

    <!-- Week Navigation -->
    <div id="trackerSection" class="tracker-section" style="display: none;">
      <div class="week-nav">
        <button id="prevWeek" class="week-btn">← Previous</button>
        <div class="week-info">
          <span id="weekDisplay">This Week</span>
          <button id="todayBtn" class="today-btn">Today</button>
        </div>
        <button id="nextWeek" class="week-btn">Next →</button>
      </div>

      <!-- Tracker Grid -->
      <div class="tracker">
        <div class="grid-header">
          <div class="habit-column-header">Habit</div>
          <div id="dayHeaders" class="day-headers">
            <!-- Day headers injected by JS -->
          </div>
          <div class="streak-column-header">Streak</div>
        </div>
        <div id="habitsList" class="habits-list">
          <!-- Habits and checkboxes injected by JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
