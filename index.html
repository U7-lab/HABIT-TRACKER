<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreakFlow — Minimal Habit Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>StreakFlow</h1>
    <p class="subtitle">Track your daily habits and build consistent streaks.</p>
  </header>

  <main class="container">
    <!-- Controls & Week Navigation -->
    <div class="controls-wrapper">
      <form id="habit-form">
        <input type="text" id="habit-input" placeholder="New habit (e.g., Read 30 mins, Exercise)" required aria-label="New habit name">
        <button type="submit" class="btn-primary">Add Habit</button>
      </form>

      <div class="nav-controls">
        <button id="prev-week" class="btn-secondary" aria-label="Previous week">← Prev</button>
        <button id="this-week" class="btn-secondary active-week">Today</button>
        <button id="next-week" class="btn-secondary" aria-label="Next week">Next →</button>
      </div>
    </div>

    <!-- Main Grid Container -->
    <div class="grid-card">
      <div class="table-responsive">
        <table id="habit-table">
          <thead>
            <tr id="table-header">
              <!-- Dynamically populated -->
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
      
      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <p>No habits added yet. Type a habit above to get started!</p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
